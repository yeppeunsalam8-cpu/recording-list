<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--sub:#6b7385;--line:#e6e8ef;--acc:#6c5ce7;--acc2:#efeafd}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;padding:22px 16px 18px}
header h1{margin:0 0 6px;font-size:22px}header p{margin:2px 0;font-size:13px;opacity:.92}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.chips::-webkit-scrollbar{display:none}.chips{scrollbar-width:none;display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{max-width:900px;margin:0 auto;padding:10px 12px 60px}
.idx{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}.idx a{font-size:12px;color:var(--acc);background:var(--acc2);padding:4px 9px;border-radius:8px;text-decoration:none}
.artist{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px 0;overflow:hidden}
.ah{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:#fbfbfe}
.ah h2{margin:0;font-size:17px}.ah span{font-size:12px;color:var(--sub)}
.row{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.dt{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;padding-top:1px}
.tt{font-size:14px;line-height:1.4;word-break:break-word}
.meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.bd{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef0f5;color:#454c5c}
.bd.t-콘서트{background:#e3f2ff;color:#1565c0}.bd.t-팬미팅{background:#ffe9f1;color:#c2185b}.bd.t-팬콘{background:#fff3e0;color:#e65100}.bd.t-직캠{background:#e8f5e9;color:#2e7d32}
.bd.q{background:#f3e5f5;color:#6a1b9a}
.cp{font-size:12px;color:var(--sub);margin-top:3px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.closed .row{display:none}
footer{font-size:12px;color:var(--sub);text-align:center;padding:20px}
.inquiry{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.inquiry a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 13px;border-radius:10px;background:#fee500;color:#191919;font-size:13px;font-weight:700;text-decoration:none}.inquiry a:hover{background:#ffeb33}.inquiry a:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style></head><body>

function chips(el,arr,get,set){el.innerHTML='';['전체',...arr].forEach(v=>{const b=document.createElement('button');b.className='chip'+(get()===v?' on':'');b.textContent=v;b.onclick=()=>{set(v);render()};el.appendChild(b)})}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  chips(document.getElementById('ag'),AG,()=>fA,v=>fA=v);chips(document.getElementById('ty'),TY,()=>fT,v=>fT=v);
  const q=document.getElementById('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows=D.filter(x=>(fA==='전체'||x.g===fA)&&(fT==='전체'||x.y===fT)&&q.every(w=>(x.a+' '+x.t+' '+x.d+' '+x.d.replace(/\./g,'').slice(2)+' '+x.y+' '+x.c.join(' ')).toLowerCase().includes(w)));
  const by={};rows.forEach(x=>(by[x.a]=by[x.a]||[]).push(x));
  const names=Object.keys(by).sort((a,b)=>AG.indexOf(by[a][0].g)-AG.indexOf(by[b][0].g)||a.localeCompare(b,'ko'));
  document.getElementById('idx').innerHTML=names.map((n,i)=>'<a href="#a'+i+'">'+esc(n)+'</a>').join('');
  document.getElementById('list').innerHTML=names.length?names.map((n,i)=>{const r=by[n].sort((a,b)=>(b.d||'0').localeCompare(a.d||'0'));

    r.map(x=>'<div class="row"><div class="dt">'+(x.d||'-')+'</div><div><div class="tt">'+esc(x.t)+'</div><div class="meta"><span class="bd t-'+x.y+'">'+x.y+'</span>'+x.b.map(b=>'<span class="bd q">'+b+'</span>').join('')+(x.n>1&&x.y!=='직캠'?'<span class="bd">영상 '+x.n+'개</span>':'')+'</div>'+(x.c.length>1||x.y==='직캠'?'<div class="cp">구성: '+esc(x.c.join(' · '))+'</div>':'')+'</div></div>').join('')+'</section>'}).join(''):'<div class="empty">검색 결과가 없어요</div>';
